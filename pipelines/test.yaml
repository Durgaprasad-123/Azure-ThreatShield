trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    displayName: 'Set up Python'
    inputs:
      versionSpec: '3.12'
      addToPath: true

  - script: |
      set -e
      cat > $(Agent.TempDirectory)/openssl-classic.cnf <<'EOF'
      openssl_conf = openssl_init
      [openssl_init]
      ssl_conf = ssl_sect
      [ssl_sect]
      system_default = system_default_sect
      [system_default_sect]
      Groups = x25519
      EOF

      export OPENSSL_CONF=$(Agent.TempDirectory)/openssl-classic.cnf

      echo "===== curl test ====="
      curl -sSI https://pypi.org/simple/ | head -5

      echo "===== pip test ====="
      python -m pip install --timeout 30 --retries 2 ruff
      ruff --version
    displayName: 'Test with classic TLS groups'
    timeoutInMinutes: 5