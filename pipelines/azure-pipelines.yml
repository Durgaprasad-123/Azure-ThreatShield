
trigger:
  branches:
    include:
      - main
      - feature/integrate-threatshield

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validation
    displayName: 'Code Validation'
    jobs:
      - job: PythonValidation
        displayName: 'Validate Python Application'
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
              addToPath: true
          - script: |
               echo "Checking DNS resolution"
               getent hosts pypi.org
               getent hosts files.pythonhosted.org

               echo "Checking PyPI HTTPS connectivity"
               curl -IL --connect-timeout 10 --max-time 20 https://pypi.org/simple/annotated-doc/

               echo "Checking package hosting HTTPS connectivity"
               curl -I --connect-timeout 10 --max-time 20 https://files.pythonhosted.org/
               displayName: 'Diagnose PyPI Connectivity'
          - script: |
              set -e
              python -m pip --version
              python -m pip install --timeout 30 --retries 2 -r requirements.txt
              python -m pip install --timeout 30 --retries 2 ruff
              ruff --version
            displayName: 'Install dependencies'

          - script: |
              python -m pytest
            displayName: 'Run Unit Tests'

          - script: |
              ruff check app
            displayName: 'Run Ruff Linting'
