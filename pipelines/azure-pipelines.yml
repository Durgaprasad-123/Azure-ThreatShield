
trigger:
  branches:
    include:
      - main
      - feature/integrate-threatshield

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validation
    displayName: 'Code Validation'
    jobs:
      - job: PythonValidation
        displayName: 'Validate Python Application'
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
              addToPath: true

          - script: |
              set -e
              python -m pip --version
              python -m pip install --timeout 30 --retries 2 -r requirements.txt
              python -m pip install --timeout 30 --retries 2 ruff
              ruff --version
            displayName: 'Install dependencies'

          - script: |
              python -m pytest
            displayName: 'Run Unit Tests'

          - script: |
              ruff check app
            displayName: 'Run Ruff Linting'
