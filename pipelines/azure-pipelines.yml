trigger:
  branches:
    include:
      - main
      - feature/integrate-threatshield

pool:
  vmImage: 'ubuntu-latest'

variables:
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_RETRIES: '10'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

stages:
  - stage: Validation
    displayName: 'Code Validation'
    jobs:
      - job: PythonValidation
        displayName: 'Validate Python Application'
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
              addToPath: true

          - task: Cache@2
            displayName: 'Cache pip'
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)

          - script: |
              set -e
              python -m pip --version
              python -m pip install -r requirements.txt ruff==0.17.6
              ruff --version
            displayName: 'Install dependencies'
            retryCountOnTaskFailure: 3

          - script: python -m pytest
            displayName: 'Run Unit Tests'

          - script: ruff check app
            displayName: 'Run Ruff Linting'

  - stage: DockerBuild
    displayName: 'Docker Image Build'
    dependsOn: Validation
    condition: succeeded()
    jobs:
      - job: BuildImage
        displayName: 'Build FastAPI Container'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Build Azurethreat Image'
            retryCountOnTaskFailure: 2
            inputs:
              command: 'build'
              repository: 'azure-threatshield'
              Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildId)

          - script: docker images azure-threatshield
            displayName: 'Verify Docker Image'