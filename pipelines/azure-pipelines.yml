trigger:
  branches:
    include:
      - main
      - feature/integrate-threatshield


pool:
  vmImage: 'ubuntu-latest'


variables:

  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_RETRIES: '10'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

  terraformWorkingDirectory: 'infra/terraform'
  terraformVersion: '1.15.7'

  azureServiceConnection: 'threatshield-azure'
  acrName: 'acrthreatshieldprasad26'

  imageName: 'azure-threatshield'
  imageTag: '$(Build.BuildId)'


stages:

  - stage: Validation
    displayName: 'Code Validation'

    jobs:

      - job: PythonValidation
        displayName: 'Validate Python Application'

        timeoutInMinutes: 20

        variables:
          OPENSSL_CONF: $(Pipeline.Workspace)/no-pq.cnf

        steps:

          - checkout: self
            clean: true


          # Restore pre-OpenSSL-3.5 TLS behaviour: omit the X25519MLKEM768
          # hybrid key share so the ClientHello stays under one packet and
          # middleboxes stop dropping the handshake (UNEXPECTED_EOF).
          - script: |
              set -euo pipefail

              cat > "$(Pipeline.Workspace)/no-pq.cnf" <<'EOF'
              openssl_conf = openssl_init

              [openssl_init]
              ssl_conf = ssl_sect

              [ssl_sect]
              system_default = system_default_sect

              [system_default_sect]
              Groups = X25519:secp256r1:x448:secp521r1:secp384r1
              EOF

            displayName: 'Disable post-quantum TLS (fix ClientHello EOF)'


          - task: UsePythonVersion@0
            displayName: 'Set up Python 3.12'

            inputs:
              versionSpec: '3.12'
              addToPath: true


          - task: Cache@2
            displayName: 'Cache pip packages'

            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'

              restoreKeys: |
                pip | "$(Agent.OS)"

              path: $(PIP_CACHE_DIR)


          - script: |
              set -euo pipefail

              python -m pip --version

              python -m pip install \
                --prefer-binary \
                --progress-bar off \
                -r requirements.txt \
                ruff

              python -m pip check

              ruff --version

            displayName: 'Install dependencies'

            timeoutInMinutes: 15

            retryCountOnTaskFailure: 2

            env:
              PIP_DEFAULT_TIMEOUT: '120'
              PIP_RETRIES: '10'


          - script: |
              set -euo pipefail

              python -m pytest

            displayName: 'Run Unit Tests'


          - script: |
              set -euo pipefail

              ruff check app

            displayName: 'Run Ruff Linting'



  - stage: Terraform
    displayName: 'Terraform Validation'

    dependsOn: Validation

    condition: succeeded()

    jobs:

      - job: TerraformValidation
        displayName: 'Validate Terraform Configuration'

        variables:
          OPENSSL_CONF: $(Pipeline.Workspace)/no-pq.cnf

        steps:

          - checkout: self


          - script: |
              set -euo pipefail

              cat > "$(Pipeline.Workspace)/no-pq.cnf" <<'EOF'
              openssl_conf = openssl_init

              [openssl_init]
              ssl_conf = ssl_sect

              [ssl_sect]
              system_default = system_default_sect

              [system_default_sect]
              Groups = X25519:secp256r1:x448:secp521r1:secp384r1
              EOF

            displayName: 'Disable post-quantum TLS (fix ClientHello EOF)'


          - script: |
              set -euo pipefail

              echo "Installing Terraform $(terraformVersion)"

              curl -fsSLo terraform.zip \
                "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"

              unzip -o terraform.zip

              sudo mv terraform /usr/local/bin/terraform

              terraform version

            displayName: 'Install Terraform'


          - script: |
              set -euo pipefail

              terraform fmt \
                -check \
                -recursive \
                -diff

              terraform init \
                -backend=false \
                -input=false

              terraform validate

            displayName: 'Terraform fmt, init and validate'

            workingDirectory: $(terraformWorkingDirectory)




  - stage: IacSecurity
    displayName: 'Terraform Security Scan'

    dependsOn: Terraform

    condition: succeeded()

    jobs:

      - job: Checkov
        displayName: 'Run Checkov'

        variables:
          OPENSSL_CONF: $(Pipeline.Workspace)/no-pq.cnf

        steps:

          - checkout: self


          - script: |
              set -euo pipefail

              cat > "$(Pipeline.Workspace)/no-pq.cnf" <<'EOF'
              openssl_conf = openssl_init

              [openssl_init]
              ssl_conf = ssl_sect

              [ssl_sect]
              system_default = system_default_sect

              [system_default_sect]
              Groups = X25519:secp256r1:x448:secp521r1:secp384r1
              EOF

            displayName: 'Disable post-quantum TLS (fix ClientHello EOF)'


          - task: UsePythonVersion@0
            displayName: 'Set up Python 3.12'

            inputs:
              versionSpec: '3.12'
              addToPath: true


          - script: |
              set -euo pipefail

              python -m pip install checkov==3.4.6

              checkov --version

            displayName: 'Install Checkov'

            retryCountOnTaskFailure: 2


          - script: |
              set -euo pipefail

              mkdir -p "$(Common.TestResultsDirectory)"

              # Human-readable output in the build log
              checkov \
                --directory $(terraformWorkingDirectory) \
                --framework terraform \
                --output cli \
                --compact \
                --soft-fail

              # JUnit XML written to an explicit FILE (not a directory)
              checkov \
                --directory $(terraformWorkingDirectory) \
                --framework terraform \
                --output junitxml \
                --soft-fail \
                > "$(Common.TestResultsDirectory)/checkov-results.xml"

            displayName: 'Run Checkov Scan'


          - task: PublishTestResults@2
            displayName: 'Publish Checkov Results'

            condition: succeededOrFailed()

            inputs:
              testResultsFormat: 'JUnit'

              testResultsFiles: |
                $(Common.TestResultsDirectory)/checkov-results.xml.xml

              testRunTitle: 'Checkov IaC Security Scan'

              failTaskOnFailedTests: false





  - stage: TerraformApply
    displayName: 'Provision Azure Infrastructure'

    dependsOn: IacSecurity

    condition: |
      and(
        succeeded(),
        eq(
          variables['Build.SourceBranch'],
          'refs/heads/feature/integrate-threatshield'
        )
      )

    jobs:

      - deployment: ApplyInfrastructure
        displayName: 'Terraform Apply'

        environment: 'threatshield-dev'

        variables:
          OPENSSL_CONF: $(Pipeline.Workspace)/no-pq.cnf

        strategy:

          runOnce:

            deploy:

              steps:

                - checkout: self


                - script: |
                    set -euo pipefail

                    cat > "$(Pipeline.Workspace)/no-pq.cnf" <<'EOF'
                    openssl_conf = openssl_init

                    [openssl_init]
                    ssl_conf = ssl_sect

                    [ssl_sect]
                    system_default = system_default_sect

                    [system_default_sect]
                    Groups = X25519:secp256r1:x448:secp521r1:secp384r1
                    EOF

                  displayName: 'Disable post-quantum TLS (fix ClientHello EOF)'


                - script: |
                    set -euo pipefail

                    echo "Installing Terraform $(terraformVersion)"

                    curl -fsSLo terraform.zip \
                      "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"

                    unzip -o terraform.zip

                    sudo mv terraform /usr/local/bin/terraform

                    terraform version

                  displayName: 'Install Terraform'


                - task: AzureCLI@2
                  displayName: 'Terraform Plan and Apply'

                  inputs:

                    azureSubscription: '$(azureServiceConnection)'

                    scriptType: 'bash'

                    scriptLocation: 'inlineScript'

                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      echo "Azure authentication successful"

                      az account show \
                        --query "{Subscription:name,Tenant:tenantId}" \
                        --output table

                      # Pass the subscription ID into Terraform
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id --output tsv)
                      export TF_VAR_subscription_id="$ARM_SUBSCRIPTION_ID"


                      echo "Initializing Terraform"

                      terraform init \
                        -input=false


                      echo "Creating Terraform plan"

                      terraform plan \
                        -input=false \
                        -out=tfplan


                      echo "Applying Terraform plan"

                      terraform apply \
                        -input=false \
                        -auto-approve \
                        tfplan


                      echo "Terraform deployment completed"



  - stage: DockerBuild
    displayName: 'Docker Build and Container Security'

    dependsOn: IacSecurity

    condition: succeeded()

    jobs:

      - job: BuildImage
        displayName: 'Build and Scan ThreatShield Image'

        variables:
          OPENSSL_CONF: $(Pipeline.Workspace)/no-pq.cnf

        steps:

          - checkout: self


          - script: |
              set -euo pipefail

              cat > "$(Pipeline.Workspace)/no-pq.cnf" <<'EOF'
              openssl_conf = openssl_init

              [openssl_init]
              ssl_conf = ssl_sect

              [ssl_sect]
              system_default = system_default_sect

              [system_default_sect]
              Groups = X25519:secp256r1:x448:secp521r1:secp384r1
              EOF

            displayName: 'Disable post-quantum TLS (fix ClientHello EOF)'


          - task: Docker@2
            displayName: 'Build Azure ThreatShield Image'

            retryCountOnTaskFailure: 2

            inputs:

              command: 'build'

              repository: '$(imageName)'

              Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'

              buildContext: '$(Build.SourcesDirectory)'

              tags: |
                $(imageTag)


          - script: |
              set -euo pipefail

              docker images $(imageName)

              docker image inspect \
                $(imageName):$(imageTag) \
                > /dev/null

              echo "Docker image exists"

            displayName: 'Verify Docker Image'


          - script: |
              set -euo pipefail

              sudo apt-get update -qq

              sudo apt-get install \
                -y \
                -qq \
                wget \
                gnupg


              wget -qO - \
                https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg \
                > /dev/null


              echo \
                "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee \
                  /etc/apt/sources.list.d/trivy.list


              sudo apt-get update -qq

              sudo apt-get install \
                -y \
                -qq \
                trivy


              trivy --version

            displayName: 'Install Trivy'

            retryCountOnTaskFailure: 2



          - script: |
              set -euo pipefail

              mkdir -p \
                $(Pipeline.Workspace)/trivy-templates


              wget -q \
                https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl \
                -O \
                $(Pipeline.Workspace)/trivy-templates/junit.tpl


              test -f \
                $(Pipeline.Workspace)/trivy-templates/junit.tpl

            displayName: 'Download Trivy JUnit Template'



          - script: |
              set -euo pipefail

              trivy image \
                --scanners vuln \
                --exit-code 0 \
                --format template \
                --template \
                "@$(Pipeline.Workspace)/trivy-templates/junit.tpl" \
                --output \
                $(Common.TestResultsDirectory)/trivy-results.xml \
                $(imageName):$(imageTag)

            displayName: 'Generate Trivy Vulnerability Report'


          - script: |
              set -euo pipefail

              trivy image \
                --scanners vuln \
                --severity CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --skip-db-update \
                $(imageName):$(imageTag)

            displayName: 'Trivy Gate - Block CRITICAL Vulnerabilities'


          - task: PublishTestResults@2
            displayName: 'Publish Trivy Results'

            condition: succeededOrFailed()

            inputs:

              testResultsFormat: 'JUnit'

              testResultsFiles: |
                $(Common.TestResultsDirectory)/trivy-results.xml

              testRunTitle: 'Trivy Container Security Scan'

              failTaskOnFailedTests: false


          - script: |
              set -euo pipefail

              docker save \
                $(imageName):$(imageTag) \
                -o \
                $(Build.ArtifactStagingDirectory)/image.tar

              ls -lh \
                $(Build.ArtifactStagingDirectory)/image.tar

            displayName: 'Save Docker Image'


          - task: PublishPipelineArtifact@1
            displayName: 'Publish Docker Image Artifact'

            inputs:

              targetPath: |
                $(Build.ArtifactStagingDirectory)/image.tar

              artifact: 'threatshield-image'



  - stage: AcrPush
    displayName: 'Publish Image to Azure Container Registry'

    dependsOn:
      - DockerBuild
      - TerraformApply

    condition: |
      and(
        succeeded('DockerBuild'),
        succeeded('TerraformApply'),
        eq(
          variables['Build.SourceBranch'],
          'refs/heads/feature/integrate-threatshield'
        )
      )

    jobs:

      - job: PushToAcr
        displayName: 'Push ThreatShield Image to ACR'

        variables:
          OPENSSL_CONF: $(Pipeline.Workspace)/no-pq.cnf

        steps:

          - checkout: none


          - script: |
              set -euo pipefail

              cat > "$(Pipeline.Workspace)/no-pq.cnf" <<'EOF'
              openssl_conf = openssl_init

              [openssl_init]
              ssl_conf = ssl_sect

              [ssl_sect]
              system_default = system_default_sect

              [system_default_sect]
              Groups = X25519:secp256r1:x448:secp521r1:secp384r1
              EOF

            displayName: 'Disable post-quantum TLS (fix ClientHello EOF)'


          - download: current
            artifact: 'threatshield-image'

            displayName: 'Download Docker Image Artifact'


          - script: |
              set -euo pipefail

              docker load \
                -i \
                $(Pipeline.Workspace)/threatshield-image/image.tar


              docker image inspect \
                $(imageName):$(imageTag) \
                > /dev/null


              echo "Docker image restored successfully"

            displayName: 'Load Docker Image'


          - task: AzureCLI@2
            displayName: 'Authenticate and Push Image to ACR'

            inputs:

              azureSubscription: '$(azureServiceConnection)'

              scriptType: 'bash'

              scriptLocation: 'inlineScript'

              inlineScript: |

                set -euo pipefail


                echo "Azure authentication successful"

                az account show \
                  --query "{Subscription:name,Tenant:tenantId}" \
                  --output table


                echo "Checking ACR"

                az acr show \
                  --name "$(acrName)" \
                  --query "{Name:name,LoginServer:loginServer}" \
                  --output table


                echo "Authenticating Docker to ACR"

                az acr login \
                  --name "$(acrName)"


                ACR_LOGIN_SERVER=$(az acr show \
                  --name "$(acrName)" \
                  --query loginServer \
                  --output tsv)


                echo "Registry: $ACR_LOGIN_SERVER"


                echo "Tagging image"

                docker tag \
                  $(imageName):$(imageTag) \
                  $ACR_LOGIN_SERVER/$(imageName):$(imageTag)


                echo "Pushing image"

                docker push \
                  $ACR_LOGIN_SERVER/$(imageName):$(imageTag)


                echo "Verifying repository"

                az acr repository show-tags \
                  --name "$(acrName)" \
                  --repository "$(imageName)" \
                  --output table


                echo "Azure ThreatShield image successfully published"