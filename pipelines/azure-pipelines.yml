trigger:
  branches:
    include:
      - main
      - feature/integrate-threatshield

pool:
  vmImage: 'ubuntu-latest'

variables:
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_RETRIES: '10'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

  terraformWorkingDirectory: 'infra/terraform'
  terraformVersion: '1.15.7'

  imageName: 'azure-threatshield'
  imageTag: '$(Build.BuildId)'

  acrName: 'acrthreatshieldprasad26'

stages:

  - stage: Validation
    displayName: 'Code Validation'

    jobs:
      - job: PythonValidation
        displayName: 'Validate Python Application'
        timeoutInMinutes: 20

        steps:
          - checkout: self
            clean: true

          - script: |
              set -e
              cat > $(Agent.TempDirectory)/openssl-classic.cnf <<'EOF'
              openssl_conf = openssl_init
              [openssl_init]
              ssl_conf = ssl_sect
              [ssl_sect]
              system_default = system_default_sect
              [system_default_sect]
              Groups = x25519
              EOF
              echo "##vso[task.setvariable variable=OPENSSL_CONF]$(Agent.TempDirectory)/openssl-classic.cnf"
            displayName: 'Pin classic TLS groups'

          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
              addToPath: true

          - task: Cache@2
            displayName: 'Cache pip'
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)

          - script: |
              set -euxo pipefail
              python -m pip install --prefer-binary --progress-bar off \
                -r requirements.txt ruff
              python -m pip check
              ruff --version
            displayName: 'Install dependencies'
            timeoutInMinutes: 15
            retryCountOnTaskFailure: 2
            env:
              PIP_DEFAULT_TIMEOUT: '120'
              PIP_RETRIES: '10'

          - script: |
              set -e
              python -m pytest
            displayName: 'Run Unit Tests'

          - script: |
              set -e
              ruff check app
            displayName: 'Run Ruff Linting'


  - stage: Terraform
    displayName: 'Terraform Validation'
    dependsOn: Validation
    condition: succeeded()

    jobs:
      - job: CheckFormat
        displayName: 'Check Terraform Formatting and Configuration'

        steps:
          - checkout: self

          - script: |
              set -e
              cat > $(Agent.TempDirectory)/openssl-classic.cnf <<'EOF'
              openssl_conf = openssl_init
              [openssl_init]
              ssl_conf = ssl_sect
              [ssl_sect]
              system_default = system_default_sect
              [system_default_sect]
              Groups = x25519
              EOF
              echo "##vso[task.setvariable variable=OPENSSL_CONF]$(Agent.TempDirectory)/openssl-classic.cnf"
            displayName: 'Pin classic TLS groups'

          - script: |
              set -e
              echo "Installing Terraform ${TERRAFORM_VERSION}"
              curl -fsSLo terraform.zip \
                "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
              unzip -o terraform.zip
              sudo mv terraform /usr/local/bin/terraform
              terraform version
            displayName: 'Install Terraform'
            env:
              TERRAFORM_VERSION: $(terraformVersion)

          - script: |
              set -e
              terraform fmt -check -recursive -diff
              terraform init -backend=false -input=false
              terraform validate
            displayName: 'Terraform fmt, init, validate'
            workingDirectory: $(terraformWorkingDirectory)


  - stage: IacSecurity
    displayName: 'Scan Terraform for Security Misconfigurations'
    dependsOn: Terraform
    condition: succeeded()

    jobs:
      - job: Checkov
        displayName: 'Scan Terraform with Checkov'

        steps:
          - checkout: self

          - script: |
              set -e
              cat > $(Agent.TempDirectory)/openssl-classic.cnf <<'EOF'
              openssl_conf = openssl_init
              [openssl_init]
              ssl_conf = ssl_sect
              [ssl_sect]
              system_default = system_default_sect
              [system_default_sect]
              Groups = x25519
              EOF
              echo "##vso[task.setvariable variable=OPENSSL_CONF]$(Agent.TempDirectory)/openssl-classic.cnf"
            displayName: 'Pin classic TLS groups'

          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
              addToPath: true

          - script: |
              set -e
              python -m pip install checkov==3.4.6
              checkov --version
            displayName: 'Install Checkov'
            retryCountOnTaskFailure: 2

          - script: |
              set -e
              checkov \
                --directory $(terraformWorkingDirectory) \
                --framework terraform \
                --output cli \
                --output junitxml \
                --output-file-path console,$(Common.TestResultsDirectory) \
                --soft-fail
            displayName: 'Run Checkov Scan'

          - task: PublishTestResults@2
            displayName: 'Publish Checkov Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Common.TestResultsDirectory)/results_junitxml.xml'
              testRunTitle: 'Checkov IaC Scan'
              failTaskOnFailedTests: false


  - stage: TerraformApply
    displayName: 'Provision Infrastructure'
    dependsOn: IacSecurity
    condition: >-
      and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/feature/integrate-threatshield'))

    jobs:
      - deployment: ApplyInfra
        displayName: 'Terraform Apply'
        environment: 'threatshield-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    set -e
                    cat > $(Agent.TempDirectory)/openssl-classic.cnf <<'EOF'
                    openssl_conf = openssl_init
                    [openssl_init]
                    ssl_conf = ssl_sect
                    [ssl_sect]
                    system_default = system_default_sect
                    [system_default_sect]
                    Groups = x25519
                    MaxProtocol = TLSv1.2
                    EOF
                    echo "##vso[task.setvariable variable=OPENSSL_CONF]$(Agent.TempDirectory)/openssl-classic.cnf"
                  displayName: 'Pin classic TLS groups (TLS 1.2)'

                # PROBE: plain curl (honors the pin) to the login endpoint,
                # BEFORE az runs. If this returns HTTP 200 but az still resets,
                # the az bundle is ignoring the config. If this resets too,
                # the endpoint is firewalled on the agent network.
                - script: |
                    echo "OPENSSL_CONF=$OPENSSL_CONF"
                    curl -sS -o /dev/null -w "login endpoint: HTTP %{http_code}\n" \
                      https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration \
                      || echo "login endpoint: FAILED"
                  displayName: 'Probe login endpoint'

                - script: |
                    set -e
                    echo "Installing Terraform ${TERRAFORM_VERSION}"
                    curl -fsSLo terraform.zip \
                      "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
                    unzip -o terraform.zip
                    sudo mv terraform /usr/local/bin/terraform
                    terraform version
                  displayName: 'Install Terraform'
                  env:
                    TERRAFORM_VERSION: $(terraformVersion)

                - task: AzureCLI@2
                  displayName: 'Terraform init, plan, apply'
                  env:
                    OPENSSL_CONF: $(Agent.TempDirectory)/openssl-classic.cnf
                    GODEBUG: 'tlsmlkem=0,tlskyber=0'
                  inputs:
                    azureSubscription: 'threatshield-azure'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      set -euo pipefail
                      terraform init  -input=false
                      terraform plan  -input=false -out=tfplan
                      terraform apply -input=false -auto-approve tfplan


  - stage: DockerBuild
    displayName: 'Docker Build and Container Scan'
    dependsOn: TerraformApply
    condition: succeeded()

    jobs:
      - job: BuildImage
        displayName: 'Build and Scan FastAPI Container'

        steps:
          - checkout: self

          - script: |
              set -e
              cat > $(Agent.TempDirectory)/openssl-classic.cnf <<'EOF'
              openssl_conf = openssl_init
              [openssl_init]
              ssl_conf = ssl_sect
              [ssl_sect]
              system_default = system_default_sect
              [system_default_sect]
              Groups = x25519
              EOF
              echo "##vso[task.setvariable variable=OPENSSL_CONF]$(Agent.TempDirectory)/openssl-classic.cnf"
            displayName: 'Pin classic TLS groups'

          - task: Docker@2
            displayName: 'Build Azure ThreatShield Image'
            retryCountOnTaskFailure: 2
            inputs:
              command: 'build'
              repository: '$(imageName)'
              Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(imageTag)

          - script: |
              set -e
              docker images $(imageName)
              docker image inspect $(imageName):$(imageTag) > /dev/null
            displayName: 'Verify Docker Image'

          - script: |
              set -e
              sudo apt-get update -qq
              sudo apt-get install -y -qq wget gnupg
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list
              sudo apt-get update -qq
              sudo apt-get install -y -qq trivy
              trivy --version
            displayName: 'Install Trivy'
            retryCountOnTaskFailure: 2

          - script: |
              set -e
              mkdir -p $(Pipeline.Workspace)/trivy-templates
              wget -q https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl \
                -O $(Pipeline.Workspace)/trivy-templates/junit.tpl
              test -f $(Pipeline.Workspace)/trivy-templates/junit.tpl
              echo "Trivy JUnit template downloaded successfully"
            displayName: 'Download Trivy JUnit Template'

          - script: |
              set -e
              trivy image \
                --scanners vuln \
                --exit-code 0 \
                --format template \
                --template "@$(Pipeline.Workspace)/trivy-templates/junit.tpl" \
                --output $(Common.TestResultsDirectory)/trivy-results.xml \
                $(imageName):$(imageTag)
            displayName: 'Trivy Scan - Generate Report'

          - script: |
              set -e
              trivy image \
                --scanners vuln \
                --severity CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --skip-db-update \
                $(imageName):$(imageTag)
            displayName: 'Trivy Scan - Gate on CRITICAL'

          - task: PublishTestResults@2
            displayName: 'Publish Trivy Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Common.TestResultsDirectory)/trivy-results.xml'
              testRunTitle: 'Trivy Container Scan'
              failTaskOnFailedTests: false

          - script: |
              set -e
              docker save $(imageName):$(imageTag) -o $(Build.ArtifactStagingDirectory)/image.tar
              ls -lh $(Build.ArtifactStagingDirectory)/image.tar
            displayName: 'Save Image to Tarball'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Image Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/image.tar'
              artifact: 'threatshield-image'


  - stage: AcrPush
    displayName: 'Push Image to ACR'
    dependsOn: DockerBuild
    condition: succeeded()

    jobs:
      - job: PushToAcr
        displayName: 'Push ThreatShield Image to ACR'

        steps:
          - checkout: none

          - script: |
              set -e
              cat > $(Agent.TempDirectory)/openssl-classic.cnf <<'EOF'
              openssl_conf = openssl_init
              [openssl_init]
              ssl_conf = ssl_sect
              [ssl_sect]
              system_default = system_default_sect
              [system_default_sect]
              Groups = x25519
              MaxProtocol = TLSv1.2
              EOF
              echo "##vso[task.setvariable variable=OPENSSL_CONF]$(Agent.TempDirectory)/openssl-classic.cnf"
            displayName: 'Pin classic TLS groups (TLS 1.2)'

          - download: current
            artifact: 'threatshield-image'
            displayName: 'Download Image Artifact'

          - script: |
              set -e
              docker load -i $(Pipeline.Workspace)/threatshield-image/image.tar
              docker images $(imageName)
            displayName: 'Load Image'

          - task: AzureCLI@2
            displayName: 'Push ThreatShield Image to ACR'
            env:
              OPENSSL_CONF: $(Agent.TempDirectory)/openssl-classic.cnf
              GODEBUG: 'tlsmlkem=0,tlskyber=0'
            inputs:
              azureSubscription: 'threatshield-azure'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acrName)"
                ACR_LOGIN_SERVER=$(az acr show --name "$(acrName)" --query loginServer -o tsv)
                docker tag  $(imageName):$(imageTag) $ACR_LOGIN_SERVER/$(imageName):$(imageTag)
                docker push $ACR_LOGIN_SERVER/$(imageName):$(imageTag)
                echo "Image pushed to ACR successfully"