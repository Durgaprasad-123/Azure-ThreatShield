
trigger:
  branches:
    include:
      - main
      - feature/integrate-threatshield

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validation
    displayName: 'Code Validation'
    jobs:
      - job: PythonValidation
        displayName: 'Validate Python Application'
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
              addToPath: true
          - script: |
              echo "Checking PyPI connectivity"
              curl -I --connect-timeout 10 --max-time 20 https://pypi.org/simple/annotated-doc/ || true

              echo "Checking package hosting connectivity"
              curl -I --connect-timeout 10 --max-time 20 https://files.pythonhosted.org/ || true
            displayName: 'Diagnose PyPI Connectivity'
          - script: |
              set -e
              python -m pip --version
              python -m pip install --timeout 30 --retries 2 -r requirements.txt
              python -m pip install --timeout 30 --retries 2 ruff
              ruff --version
            displayName: 'Install dependencies'

          - script: |
              python -m pytest
            displayName: 'Run Unit Tests'

          - script: |
              ruff check app
            displayName: 'Run Ruff Linting'

  - stage: DockerBuild
    displayName: 'Docker Image Build'
    dependsOn: []

    jobs:
      - job: BuildImage
        displayName: 'Build FastApi Container'

        steps:
          - checkout: self
          - task:  Docker@2
            displayName: 'Build Azurethreat Image'
            inputs:
              command: 'build'
              repository: 'azure-threatshield'
              Dockerfile: '$(Build.SorcesDirectory)/Dockerfile'
              buildcontext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildId)
          
          - script: |
              docker images azure-threatshield
              displayName: 'Verify Docker Image'